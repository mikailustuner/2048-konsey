<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 Konsey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --fg: #0f172a; --muted: #475569; --border: #cbd5e1;
    --accent: #15803d; --on-accent: #ffffff; --ring: #0f172a; --cell: #e2e8f0; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --card: #1b2336; --fg: #f8fafc; --muted: #94a3b8; --border: #475569;
      --accent: #22c55e; --on-accent: #0f172a; --ring: #ffffff; --cell: #272f42; --bad: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font: 700 1.25rem "JetBrains Mono", monospace; margin: 0; }
  .tabs { display: flex; gap: 8px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: .875rem; color: var(--muted); margin-bottom: 4px; }
  select, input, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; min-height: 44px; padding: 8px 12px; width: 100%; }
  input[type=range] { padding: 0; accent-color: var(--accent); border: 0; background: transparent; }
  button { cursor: pointer; transition: border-color .15s, background .15s; }
  button:hover { border-color: var(--fg); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .tabs button { width: auto; }
  .inline { display: flex; gap: 8px; }
  .inline > * { flex: 1; }
  :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .hint { font-size: .875rem; color: var(--muted); margin: 8px 0 0; }
  .status { min-height: 1.5em; font-size: .875rem; color: var(--muted); margin: 8px 0 0; }
  .status.bad { color: var(--bad); font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 16px;
    font-family: "JetBrains Mono", monospace; }
  .stats div { font-size: .8125rem; color: var(--muted); }
  .stats b { display: block; font-size: 1.125rem; color: var(--fg); }
  .boardwrap { position: relative; width: min(100%, 480px); margin: 0 auto; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--border); padding: 8px;
    border-radius: 12px; aspect-ratio: 1; touch-action: none; }
  .tile { display: grid; place-items: center; border-radius: 8px; background: var(--cell); min-width: 0; overflow: hidden;
    font: 700 clamp(.75rem, 4.5vw, 1.75rem) "JetBrains Mono", monospace; transition: background .12s; }
  .tile.new { animation: pop .15s ease-out; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile.new { animation: none; } }
  .overlay { position: absolute; inset: 0; display: none; place-items: center; text-align: center; border-radius: 12px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); font-family: "JetBrains Mono", monospace; padding: 16px; }
  .overlay.show { display: grid; }
  .overlay b { display: block; font-size: 1.5rem; }
  .arrow { font: 700 1.125rem "JetBrains Mono", monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>2048 konsey</h1>
    <div class="tabs" role="tablist" aria-label="Mod">
      <button id="tab-watch" role="tab" aria-pressed="true" aria-controls="watch">Modeli izle</button>
      <button id="tab-human" role="tab" aria-pressed="false" aria-controls="human">Kendin oyna</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel" id="watch" aria-label="Model ayarları">
      <div class="field">
        <label for="model">Model</label>
        <select id="model" disabled><option>Yükleniyor…</option></select>
      </div>
      <div class="field">
        <label for="depth">Arama derinliği</label>
        <select id="depth">
          <option value="1">1 — açgözlü (çok hızlı)</option>
          <option value="2" selected>2 — expectimax</option>
          <option value="3">3 — expectimax (yavaş)</option>
        </select>
      </div>
      <div class="field">
        <label for="seed">Tohum</label>
        <div class="inline"><input id="seed" type="number" min="0" value="1000000"><button id="rand" type="button">Rastgele</button></div>
      </div>
      <div class="field">
        <label for="speed">Hız: <span id="speedv">30 hamle/sn</span></label>
        <input id="speed" type="range" min="1" max="201" value="30">
      </div>
      <button id="go" class="primary">Başlat</button>
      <p id="wstatus" class="status" role="status" aria-live="polite"></p>
      <p class="hint">Yeni modeller <code>runs/</code> veya <code>models/</code> altına <code>.bin</code> olarak konunca listede görünür (<code>tools/fetch_model.sh</code>).</p>
    </section>

    <section class="panel" id="human" aria-label="Oyun ayarları" hidden>
      <div class="field">
        <label for="hseed">Tohum</label>
        <div class="inline"><input id="hseed" type="number" min="0" value="1000000"><button id="hrand" type="button">Rastgele</button></div>
      </div>
      <button id="hnew" class="primary">Yeni oyun</button>
      <p class="hint">Ok tuşları / WASD veya kaydırma. Aynı tohum = modelin oynadığı kare dizisinin aynısı.</p>
      <p id="hstatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-label="Oyun">
      <div class="stats">
        <div>Hamle<b id="s-move">0</b></div>
        <div>Skor<b id="s-score">0</b></div>
        <div>En büyük<b id="s-max">–</b></div>
        <div id="s-dir-wrap">Son hamle<b id="s-dir" class="arrow">–</b></div>
        <div id="s-ms-wrap">Düşünme<b id="s-ms">–</b></div>
      </div>
      <div class="boardwrap">
        <div id="board" class="board" role="img" aria-label="Tahta"></div>
        <div id="overlay" class="overlay" aria-live="polite"><div><b id="ov-title">Oyun bitti</b><span id="ov-text"></span></div></div>
      </div>
    </section>
  </div>
</main>
<script type="module">
import { Rng, spawn, move, canMove, DIRS } from "./engine.js";

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("tr-TR");
const ARROW = { U: "↑ yukarı", R: "→ sağ", D: "↓ aşağı", L: "← sol", "-": "–" };
// Light tiles carry dark ink, dark tiles white ink (both >= 4.5:1).
const TILE = ["", "#eee4da", "#ede0c8", "#f2b179", "#f59563", "#f67c5f", "#f65e3b", "#edcf72", "#edcc61", "#edc850",
  "#edc53f", "#edc22e", "#3c3a32", "#1e3a8a", "#581c87", "#7f1d1d", "#14532d", "#0c4a6e", "#111827"];
const tiles = [...Array(16)].map(() => { const t = document.createElement("div"); t.className = "tile"; $("board").append(t); return t; });
let shown = Array(16).fill(0);

function draw(cells, stats) {
  cells.forEach((e, i) => {
    const t = tiles[i];
    t.textContent = e ? fmt(2 ** e) : "";
    t.style.background = e ? TILE[Math.min(e, 18)] : "";
    t.style.color = e >= 12 ? "#ffffff" : "#1f2937";
    t.classList.toggle("new", e !== 0 && shown[i] === 0);
  });
  shown = cells.slice();
  $("s-move").textContent = fmt(stats.move);
  $("s-score").textContent = fmt(stats.score);
  $("s-max").textContent = fmt(2 ** Math.max(...cells));
  if (stats.dir !== undefined) $("s-dir").textContent = ARROW[stats.dir] || "–";
  if (stats.ms !== undefined) $("s-ms").textContent = stats.ms < 1 ? "<1 ms" : `${stats.ms.toFixed(0)} ms`;
  $("board").setAttribute("aria-label", `Tahta, hamle ${stats.move}, skor ${stats.score}`);
}
function overlay(show, title = "", text = "") {
  $("overlay").classList.toggle("show", show);
  $("ov-title").textContent = title;
  $("ov-text").textContent = text;
}
const setStatus = (id, msg, bad = false) => { $(id).textContent = msg; $(id).className = "status" + (bad ? " bad" : ""); };
const randomSeed = () => Math.floor(Math.random() * 1e9);

// ---- Mode switch ----
let mode = "watch";
function setMode(m) {
  mode = m;
  $("tab-watch").setAttribute("aria-pressed", m === "watch");
  $("tab-human").setAttribute("aria-pressed", m === "human");
  $("watch").hidden = m !== "watch";
  $("human").hidden = m !== "human";
  $("s-dir-wrap").hidden = $("s-ms-wrap").hidden = m !== "watch";
  stopWatch();
  overlay(false);
  if (m === "human") newHuman();
}
$("tab-watch").onclick = () => setMode("watch");
$("tab-human").onclick = () => setMode("human");

// ---- Watch the model (gateway SSE) ----
let es = null, queue = [], timer = null, ended = null;
async function loadModels() {
  try {
    const r = await fetch("/api/models");
    const j = await r.json();
    const sel = $("model");
    sel.innerHTML = "";
    if (!j.models.length) {
      sel.add(new Option("Model yok", ""));
      setStatus("wstatus", "Model bulunamadı: runs/ veya models/ altına bir .bin koyun.", true);
      return;
    }
    for (const m of j.models) {
      const date = new Date(m.mtime * 1000).toLocaleDateString("tr-TR");
      sel.add(new Option(`${m.id} · ${m.tuples} tuple · ${fmt(m.games)} oyun · ${date}`, m.id));
    }
    sel.disabled = false;
    if (!j.play_built) setStatus("wstatus", "build/play derlenmemiş: cmake --build build", true);
    else setStatus("wstatus", `${j.models.length} model hazır.`);
  } catch {
    setStatus("wstatus", "Gateway'e ulaşılamadı. gui/server.py çalışıyor mu?", true);
  }
}
function speed() { return +$("speed").value; }
$("speed").oninput = () => {
  $("speedv").textContent = speed() > 200 ? "anlık" : `${speed()} hamle/sn`;
  if (timer) { clearInterval(timer); timer = setInterval(tick, 1000 / Math.min(speed(), 200)); }
};
function tick() {
  if (!queue.length) {
    if (ended) finish();
    return;
  }
  // "anlık": jump to the newest position.
  const f = speed() > 200 ? queue.splice(0).pop() : queue.shift();
  draw(f.cells, { move: f.i, score: f.score, dir: f.dir, ms: f.ms });
}
function finish() {
  const e = ended;
  draw(e.cells, { move: e.moves, score: e.score, dir: "-" });
  overlay(true, "Oyun bitti", `skor ${fmt(e.score)} · en büyük ${fmt(e.max_tile)} · ${fmt(e.moves)} hamle`);
  setStatus("wstatus", `Bitti — tohum ${e.seed}.`);
  stopWatch();
}
function stopWatch() {
  if (es) es.close();
  es = null;
  clearInterval(timer);
  timer = null;
  queue = [];
  ended = null;
  $("go").textContent = "Başlat";
}
$("go").onclick = () => {
  if (es || timer) { stopWatch(); setStatus("wstatus", "Durduruldu."); return; }
  const model = $("model").value;
  if (!model) return;
  overlay(false);
  const q = new URLSearchParams({ model, depth: $("depth").value, seed: $("seed").value || "0" });
  es = new EventSource("/api/play?" + q);
  setStatus("wstatus", "Model oynuyor…");
  $("go").textContent = "Durdur";
  es.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === "pos") queue.push(m);
    else if (m.t === "end") { ended = m; es.close(); es = null; }
    else if (m.t === "error") { setStatus("wstatus", "Hata: " + m.msg, true); stopWatch(); }
  };
  es.onerror = () => {
    if (es && !ended) { setStatus("wstatus", "Bağlantı koptu (geçersiz istek ya da gateway kapandı).", true); stopWatch(); }
  };
  timer = setInterval(tick, 1000 / Math.min(speed(), 200));
};
$("rand").onclick = () => { $("seed").value = randomSeed(); };

// ---- Play yourself ----
let hg = null, hrng = null, hscore = 0, hmoves = 0;
function newHuman() {
  hrng = new Rng($("hseed").value || 0);
  hg = Array(16).fill(0);
  spawn(hg, hrng); spawn(hg, hrng);
  hscore = hmoves = 0;
  shown = Array(16).fill(0);
  overlay(false);
  draw(hg, { move: 0, score: 0 });
  setStatus("hstatus", `Tohum ${$("hseed").value}`);
  $("board").focus?.();
}
function humanMove(d) {
  if (mode !== "human" || !hg) return;
  const s = move(hg, d);
  if (s < 0) return;
  hscore += s; hmoves++;
  spawn(hg, hrng);
  draw(hg, { move: hmoves, score: hscore });
  if (!canMove(hg)) overlay(true, "Oyun bitti", `skor ${fmt(hscore)} · en büyük ${fmt(2 ** Math.max(...hg))}`);
}
$("hnew").onclick = newHuman;
$("hrand").onclick = () => { $("hseed").value = randomSeed(); newHuman(); };
const KEYS = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 };
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT"].includes(e.target.tagName)) return;
  if (e.key in KEYS && mode === "human") { e.preventDefault(); humanMove(KEYS[e.key]); }
});
let touch = null;
$("board").addEventListener("pointerdown", e => { touch = [e.clientX, e.clientY]; });
$("board").addEventListener("pointerup", e => {
  if (!touch) return;
  const dx = e.clientX - touch[0], dy = e.clientY - touch[1];
  touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  humanMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});

draw(shown, { move: 0, score: 0 });
loadModels();
</script>
</body>
</html>
